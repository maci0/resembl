# .pre-commit-config.yaml
#
# The linters run from the project's own locked environment (uv run), the same
# toolchain CI installs with `uv sync --locked`.  Mirror hooks pin their own
# interpreter and tool versions, which drift from uv.lock: a green commit then
# fails remotely, or the reverse, and the local result stops predicting CI.
# `pass_filenames: false` keeps each tool on the scope its own config declares
# (ruff: the project; black: the project; mypy: `files` in pyproject.toml),
# which is also the scope CI runs.  `--locked` on every entry is what makes
# "the project's own locked environment" true: plain `uv run` re-resolves and
# rewrites uv.lock in the working tree when pyproject.toml has drifted, so the
# hook would then check the code against a lockfile no other contributor, and
# no CI run, ever sees.
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    # Pinned to the commit, not the tag: a tag is a mutable ref, so whoever
    # controls the upstream repository could repoint v5.0.0 and have every
    # `git commit` and every CI run execute the new tree with the whole
    # working copy in reach.  The comment is what `pre-commit autoupdate`
    # reads back, so the release stays identifiable.
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b  # v5.0.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace

-   repo: local
    hooks:
    -   id: black
        name: black
        entry: uv run --locked black
        language: system
        types: [python]
        pass_filenames: false

    -   id: ruff
        name: ruff
        entry: uv run --locked ruff check
        language: system
        types: [python]
        pass_filenames: false
        args: [--fix, --exit-non-zero-on-fix]

    -   id: mypy
        name: mypy
        entry: uv run --locked mypy
        language: system
        types: [python]
        pass_filenames: false
        # mypy's incremental cache is not safe against concurrent writers.
        require_serial: true

    -   id: pylint
        name: pylint
        entry: uv run --locked pylint
        language: system
        types: [python]
        pass_filenames: false
        args: ["resembl/", "tests/", "fuzzers/"]
