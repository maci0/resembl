# .github/workflows/codeql.yml
name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 2 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

# Every `run:` step gets `set -euo pipefail`, so a failed command in a
# pipeline fails the step instead of passing silently (see service.yml).
defaults:
  run:
    shell: bash

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    # Pinned, not ubuntu-latest: the floating label migrates OS versions
    # under a green run. Bump deliberately, like a digest pin.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: [ 'python', 'go' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # The analysis only reads the tree, so the token is not left in
        # .git/config for a later step to read and leak.
        persist-credentials: false

    - name: Initialize CodeQL
      uses: github/codeql-action/init@e274593ecfcbcdc39c8f034978d84614cebcb71d # v4.39.5
      with:
        languages: ${{ matrix.language }}

    # No autobuild step: Python and Go are extracted from source by CodeQL
    # itself, so an autobuild pass only adds a way to fail for a compiler
    # the project does not use.
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@e274593ecfcbcdc39c8f034978d84614cebcb71d # v4.39.5
      with:
        category: "/language:${{matrix.language}}"
