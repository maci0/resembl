# .github/workflows/coverage.yml
name: Code Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same service and env wiring as the test gate, so the reported
    # percentage covers the database integration tests too.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: resembl
          MYSQL_USER: resembl
          MYSQL_PASSWORD: resembl
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      RESEMBL_TEST_PG_URL: postgresql+pg8000://postgres:postgres@localhost:5432/postgres
      RESEMBL_TEST_MYSQL_URL: mysql+pymysql://resembl:resembl@localhost:3306/resembl
    steps:
    - uses: actions/checkout@v5
      with:
        # No job here pushes, so the token is not left in .git/config for a
        # later step, or a test that shells out, to read and leak.
        persist-credentials: false
    # No actions/setup-python step: uv manages the interpreter, so a second
    # copy of CPython on the runner is downloaded and then never used.
    - uses: ./.github/actions/setup-uv
      with:
        python-version: '3.13'

    - name: Install dependencies
      # Installs exactly the committed uv.lock (hash-verified, reproducible)
      # and fails if the lock has drifted from pyproject.toml.
      run: uv sync --locked --extra dev

    - name: Run tests and generate coverage report
      run: |
        uv run pytest --cov=resembl --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }} # Optional for private repos
        fail_ci_if_error: true
