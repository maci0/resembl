# .github/workflows/coverage.yml
name: Code Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install uv and Python
      uses: astral-sh/setup-uv@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      # Installs exactly the committed uv.lock (hash-verified, reproducible)
      # and fails if the lock has drifted from pyproject.toml.
      run: uv sync --locked --extra dev

    - name: Run tests and generate coverage report
      run: |
        uv run pytest --cov=resembl --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }} # Optional for private repos
        fail_ci_if_error: true
