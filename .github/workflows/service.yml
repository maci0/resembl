name: Go service

# The experimental query service in service/ is a separate Go module, so the
# Python workflows never build it.  Scoped to main like every other workflow.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: service-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  service:
    # Pinned, not ubuntu-latest: the floating label migrates OS versions
    # under a green run. Bump deliberately, like a digest pin.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: service/go.mod
          cache-dependency-path: service/go.sum
      - name: Check formatting, vet and test
        run: make service-check
      - name: Build the service image
        # The Dockerfile is the deployment artifact for service/; a build
        # that only runs `go test` would let a broken Dockerfile merge
        # undetected until an operator builds it by hand.
        # SOURCE_DATE_EPOCH is the commit time of HEAD (the same clock
        # `make dist` pins), so the image's created timestamp and the
        # binary's embedded build time are reproducible; REVISION and
        # VERSION pin the OCI labels instead of the Dockerfile's
        # defaults (unknown/dev). GitHub injects SOURCE_DATE_EPOCH=0
        # into every step's environment, which the Dockerfile would
        # otherwise inherit as its reproducible-but-wrong epoch.
        run: docker build -f service/Dockerfile -t resembl-service:ci . --build-arg SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" --build-arg REVISION="${{ github.sha }}" --build-arg VERSION="${{ github.ref_name }}"
      - name: Smoke-test the service image
        # A successful build does not prove the entrypoint runs: a broken
        # COPY path or a missing binary would only fail on an operator's
        # host. `resembl-service -h` prints the flag list without needing a
        # custody directory, token or engine; Go's flag package exits 1 on
        # -h, so the check is the output, not the exit code. The output is
        # captured before grepping, not piped into grep: a pipeline's exit
        # code is grep's under the default shell (which has no pipefail),
        # but a `set -o pipefail` shell would fail the step on the docker
        # exit code even when the usage line is present.
        run: |
          set -e
          output="$(docker run --rm resembl-service:ci -h 2>&1 || true)"
          printf '%s\n' "$output" | grep -q 'Usage of resembl-service:'
