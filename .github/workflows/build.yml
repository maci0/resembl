# Build the release artifacts.
#
# Nothing else in CI produces the sdist or the wheel, so a packaging change
# (a new data file, a `[tool.setuptools]` edit, a `MANIFEST.in`) could pass
# every other gate and still ship an artifact that is missing a file or differs
# between two builds of the same commit.  This workflow runs `make dist-verify`,
# which builds twice and fails unless the two builds are byte-identical, and
# then installs the wheel into a throwaway environment and runs the entry
# point, which is the check CONTRIBUTING.md asks a maintainer to do by hand
# before tagging.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # The build clock is the commit time of HEAD (see `dist` in the
          # Makefile), so a tag build and a branch build of the same commit
          # agree on SOURCE_DATE_EPOCH.  Fetching one tag of history is enough.
          fetch-depth: 1
          # Nothing here pushes, so the token is not left in .git/config for a
          # later step to read and leak.
          persist-credentials: false

      - uses: ./.github/actions/setup-uv
        with:
          python-version: '3.13'

      - name: Build the sdist and the wheel, twice, and compare
        run: make dist-verify

      - name: Install the wheel and run the entry point
        run: |
          set -euo pipefail
          uv venv --python 3.13 dist/wheel-venv
          # --no-deps is not an option here: the wheel declares its runtime
          # dependencies, and an install that skipped them would pass a
          # smoke test the real installation would fail.
          uv pip install --python dist/wheel-venv/bin/python dist/*.whl
          dist/wheel-venv/bin/resembl --help
          dist/wheel-venv/bin/resembl-find --help

      - name: Install the sdist and run the entry point
        run: |
          set -euo pipefail
          uv venv --python 3.13 dist/sdist-venv
          uv pip install --python dist/sdist-venv/bin/python dist/*.tar.gz
          dist/sdist-venv/bin/resembl --help

      - name: Upload the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resembl-dist-${{ github.sha }}
          # The published sdist and wheel are the tag's own artifact; this copy
          # exists so a run can be inspected after the fact.  A month is longer
          # than any investigation into a release takes, and the default 90
          # days only accumulates superseded builds of every push.
          retention-days: 30
          # Only the archives, not the throwaway environments built above.
          path: |
            dist/*.whl
            dist/*.tar.gz

  # Provenance for the release artifacts.  The job above builds the sdist and
  # the wheel a release consists of, and the SBOM workflow inventories what is
  # inside them, but neither ties those bytes to this repository: a consumer
  # cannot tell an official artifact from anything else carrying the same
  # name, because both the name and the version are things a third party can
  # write.  A Sigstore-backed provenance attestation records the workflow run,
  # the commit and the artifact digests, and `gh attestation verify` checks
  # them offline against the digest the consumer downloaded.
  #
  # Tag runs only.  A pull request has no release artifact to attest, and
  # `id-token: write` is the scope that can mint a token for anything at all,
  # so it is granted to a job that exists on a tag and to nothing else.
  attest:
    name: attest provenance
    needs: dist
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The OIDC token the attestation is signed with, and the store it is
      # written to.  Both are needed only to attest, and both are refused to
      # a pull request from a fork regardless of what this workflow declares.
      id-token: write
      attestations: write
    steps:
      - name: Download the built artifacts
        uses: actions/download-artifact@v4
        with:
          name: resembl-dist-${{ github.sha }}
          path: dist

      - name: Attest the sdist and the wheel
        uses: actions/attest-build-provenance@v4
        with:
          # The download directory holds the two archives and nothing else
          # (the dist job uploads the archives, not the throwaway venvs it
          # built beside them), so one glob covers both subjects.
          subject-path: 'dist/*'
