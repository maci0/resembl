# .github/workflows/release-drafter.yml
name: Release Drafter

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]

# The drafter edits one shared draft release, so two runs finishing together
# would race on the same release; the newer run wins and the older one is
# dropped, as on the other workflows.
concurrency:
  group: release-drafter-${{ github.ref }}
  cancel-in-progress: true

# The drafter edits the draft release on main and comments the changelog
# preview on the PR, so it needs exactly these two write scopes.
permissions:
  contents: write
  pull-requests: write

jobs:
  update_release_draft:
    # The drafter writes the draft release and posts the changelog preview as
    # a comment, and both need the write scopes above.  A pull request from a
    # fork runs with a read-only GITHUB_TOKEN whatever this workflow declares,
    # so the run could only fail on the write; the job skips it instead, and a
    # same-repository pull request is drafted and commented on as before.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
