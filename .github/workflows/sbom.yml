# Software Bill of Materials generation.
#
# Produces a CycloneDX 1.5 inventory of every runtime dependency that ships
# with a release, exported directly from the hash-pinned uv.lock by uv itself,
# so consumers and vuln scanners can see exactly what was built without any
# extra third-party tooling.
name: SBOM

on:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    # Pinned, not ubuntu-latest: the floating label migrates OS versions
    # under a green run. Bump deliberately, like a digest pin.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job here pushes, so the token is not left in .git/config for a
          # later step to read and leak.
          persist-credentials: false

      # python-version 3.15.2, like every other job: the value keys the
      # uv cache (see setup-uv), and an empty default reads .python-version
      # only for the interpreter choice, so a no-input call would restore a
      # cache no other job shares.
      - uses: ./.github/actions/setup-uv
        with:
          python-version: '3.15.2'

      - name: Export CycloneDX SBOM from uv.lock
        # The `make sbom` target, not a second copy of its command: this
        # inventory is what a release is assessed with, and a workflow that
        # exported it its own way is how the two drift into describing
        # different dependency sets.  Runtime dependencies only (`--no-dev` in
        # the target), package hashes preserved, so the SBOM doubles as an
        # integrity manifest.  The file lands in build/, like every other
        # generated artifact, and not in the repository root.
        run: make sbom

      - name: Validate SBOM parses as JSON
        run: python3 -c "import json; json.load(open('build/sbom.cdx.json'))"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx-${{ github.sha }}
          # A release SBOM is consumed while a release is being assessed, not
          # kept; a tag run regenerates the same bytes from the same lockfile.
          retention-days: 30
          path: build/sbom.cdx.json
