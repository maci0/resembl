# Software Bill of Materials generation.
#
# Produces a CycloneDX 1.5 inventory of every runtime dependency that ships
# with a release, exported directly from the hash-pinned uv.lock by uv itself,
# so consumers and vuln scanners can see exactly what was built without any
# extra third-party tooling.
name: SBOM

on:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # No job here pushes, so the token is not left in .git/config for a
          # later step to read and leak.
          persist-credentials: false

      - uses: ./.github/actions/setup-uv

      - name: Export CycloneDX SBOM from uv.lock
        # Runtime dependencies only: this is the set that ships to users.
        # Package hashes are preserved so the SBOM doubles as an integrity
        # manifest.
        run: uv export --preview-features sbom-export --format cyclonedx1.5 --output-file sbom.cdx.json

      - name: Validate SBOM parses as JSON
        run: jq empty sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx-${{ github.sha }}
          # A release SBOM is consumed while a release is being assessed, not
          # kept; a tag run regenerates the same bytes from the same lockfile.
          retention-days: 30
          path: sbom.cdx.json
