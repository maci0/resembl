name: Test Suite

on:
  push:
  pull_request:

# Superseded runs are pointless: the gate only reports the newest commit.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: resembl
          MYSQL_USER: resembl
          MYSQL_PASSWORD: resembl
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Enables tests/test_pg_integration.py and test_mysql_integration.py
      # (skipped otherwise).
      RESEMBL_TEST_PG_URL: postgresql+pg8000://postgres:postgres@localhost:5432/postgres
      RESEMBL_TEST_MYSQL_URL: mysql+pymysql://resembl:resembl@localhost:3306/resembl
    steps:
      - uses: actions/checkout@v5

      # No actions/setup-python step: uv manages the interpreter, so a second
      # copy of CPython on the runner is downloaded and then never used.
      - uses: ./.github/actions/setup-uv
        with:
          python-version: '3.13'

      - name: Install dependencies
        # Installs exactly the committed uv.lock (hash-verified, reproducible)
        # and fails if the lock has drifted from pyproject.toml.
        run: uv sync --locked --extra dev

      - name: Run mypy
        run: uv run mypy

      - name: Run ruff
        run: uv run ruff check .

      - name: Check formatting with black
        run: uv run black --check .

      - name: Run tests
        run: uv run pytest -q

  # README.md, CONTRIBUTING.md and docs/tutorial.md all document Windows
  # (and macOS is implied by the POSIX install path), so those platforms are
  # claimed.  The `test` job above runs the static checks and the database
  # integration suite, which need the two Linux service containers; this job
  # runs the same suite on every claimed OS without them, where the
  # PostgreSQL and MySQL modules skip themselves.  The portability surface it
  # covers is exactly the one Linux cannot see: path separators and reserved
  # filenames in the export path, `spawn` process pools, msvcrt file
  # locking, text-mode line endings, and the subprocess-free server port
  # file's `os.replace` publication.
  portability:
    name: portability (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-uv
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run tests
        run: uv run pytest -q
