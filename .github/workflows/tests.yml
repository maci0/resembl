name: Test Suite

# Scoped to main like every other workflow here.  An unscoped `push` fires on
# the branch and `pull_request` fires again on the merge ref, and because the
# two refs differ they are different concurrency groups, so every push to a
# feature branch ran this suite twice, each run standing up its own PostgreSQL
# and MySQL containers.  The pull request already tests the merge result.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded runs are pointless: the gate only reports the newest commit.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: resembl
          MYSQL_USER: resembl
          MYSQL_PASSWORD: resembl
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Enables tests/test_pg_integration.py and test_mysql_integration.py
      # (skipped otherwise).
      RESEMBL_TEST_PG_URL: postgresql+pg8000://postgres:postgres@localhost:5432/postgres
      RESEMBL_TEST_MYSQL_URL: mysql+pymysql://resembl:resembl@localhost:3306/resembl
    steps:
      - uses: actions/checkout@v5
        with:
          # No job here pushes, so the token is not left in .git/config for a
          # later step, or a test that shells out, to read and leak.
          persist-credentials: false

      # No actions/setup-python step: uv manages the interpreter, so a second
      # copy of CPython on the runner is downloaded and then never used.
      - uses: ./.github/actions/setup-uv
        with:
          python-version: '3.13'

      - name: Install dependencies
        # Installs exactly the committed uv.lock (hash-verified, reproducible)
        # and fails if the lock has drifted from pyproject.toml.
        run: uv sync --locked --extra dev

      - name: Run mypy
        run: uv run mypy

      - name: Run ruff
        run: uv run ruff check .

      - name: Check formatting with black
        run: uv run black --check .

      - name: Run tests
        run: uv run pytest -q

  # README.md, CONTRIBUTING.md and docs/tutorial.md all document Windows
  # (and macOS is implied by the POSIX install path), so those platforms are
  # claimed.  The `test` job above runs the static checks and the database
  # integration suite on Linux, which needs the two service containers; this
  # job runs the same suite on the two platforms Linux cannot stand in for,
  # where the PostgreSQL and MySQL modules skip themselves.  The portability
  # surface it covers is exactly that: path separators and reserved
  # filenames in the export path, `spawn` process pools, msvcrt file
  # locking, text-mode line endings, and the subprocess-free server port
  # file's `os.replace` publication.  No Linux leg, because the `test` job
  # already runs this suite there: a third runner bought no platform the
  # matrix did not already have, and a second full suite on Linux only
  # lengthened every push and pull request.
  portability:
    name: portability (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # No job here pushes, so the token is not left in .git/config for a
          # later step, or a test that shells out, to read and leak.
          persist-credentials: false

      - uses: ./.github/actions/setup-uv
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run tests
        run: uv run pytest -q
