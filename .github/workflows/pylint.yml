name: Pylint

# Scoped to main like every other workflow here, so a push to a feature branch
# and its pull request do not both pay for the two-leg matrix (see
# tests.yml for the same change and its reason).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: pylint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The matrix starts at 3.13: the project requires Python >=3.13 (see
  # requires-python in pyproject.toml), so a 3.12 leg could not even
  # install the lockfile.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    # The matrix interpreter reaches `uv sync` as UV_PYTHON, exported by the
    # setup-uv action from its python-version input.
    steps:
    - uses: actions/checkout@v5
      with:
        # No job here pushes, so the token is not left in .git/config for a
        # later step, or a test that shells out, to read and leak.
        persist-credentials: false
    - uses: ./.github/actions/setup-uv
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      # Installs exactly the committed uv.lock (hash-verified, reproducible)
      # and fails if the lock has drifted from pyproject.toml.
      run: uv sync --locked --extra dev
    - name: Analysing the code with pylint
      # Same target set as the pre-commit hook, so CI and the local hook
      # gate the same files.
      run: |
        uv run pylint resembl/ tests/ fuzzers/
