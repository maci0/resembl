name: Pylint

on: [push, pull_request]

concurrency:
  group: pylint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The matrix starts at 3.13: the project requires Python >=3.13 (see
  # requires-python in pyproject.toml), so a 3.12 leg could not even
  # install the lockfile.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      # Make uv sync build .venv from the matrix interpreter.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
    - uses: actions/checkout@v5
    - name: Install uv
      # Pinned uv version: the installer script is fetched over the network
      # and silently pulls the newest uv otherwise, so the build tool drifts
      # between runs. UV_VERSION selects an exact release.
      run: curl -LsSf https://astral.sh/uv/install.sh | env UV_VERSION=0.12.13 sh
    - name: Install dependencies
      # Installs exactly the committed uv.lock (hash-verified, reproducible)
      # and fails if the lock has drifted from pyproject.toml.
      run: uv sync --locked --extra dev
    - name: Analysing the code with pylint
      # Same target set as the pre-commit hook, so CI and the local hook
      # gate the same files.
      run: |
        uv run pylint resembl/ tests/ fuzzers/
