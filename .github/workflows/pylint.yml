name: Pylint

on: [push, pull_request]

concurrency:
  group: pylint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # No version matrix: the project requires Python >=3.13 (see
  # requires-python in pyproject.toml), so a 3.12 leg could not even
  # install the lockfile.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v5
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        python-version: '3.13'
    - name: Install dependencies
      # Installs exactly the committed uv.lock (hash-verified, reproducible)
      # and fails if the lock has drifted from pyproject.toml.
      run: uv sync --locked --extra dev
    - name: Analysing the code with pylint
      # Same target set as the pre-commit hook, so CI and the local hook
      # gate the same files.
      run: |
        uv run pylint resembl/ tests/ fuzzers/
