# .github/release-drafter.yml
# The project releases by hand (a `release X.Y.Z` commit bumps the manifest
# and writes the CHANGELOG section) but drafts and tags here, so the version
# resolver has to follow SemVer: a `!` after the Conventional Commit
# type/scope has to land on a major, never on a patch.  The autolabeler below
# matches commit subjects, which is also all `change-template` prints, so the
# `!` has to be in the subject; a `BREAKING CHANGE:` footer in the body
# reaches neither and does not move the version.
#
# One gap that outlives any config here: a break committed before its subject
# carried the `!` labels as `fix` or `refactor`, so `$RESOLVED_VERSION` reads
# below the real compatibility and the draft offers a patch for a release that
# removes public names.  The `**Breaking:**` bullets in CHANGELOG.md are the
# authority in that case, and tests/test_changelog.py fails a release whose
# written section contradicts them.  Read the draft's number against the
# `[Unreleased]` notes before publishing it.
name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
version-resolver:
  major:
    labels:
      - 'major'
  minor:
    labels:
      - 'minor'
  patch:
    labels:
      - 'patch'
  default: patch
categories:
  - title: '💥 Breaking Changes'
    labels:
      - 'major'
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
      - 'minor'
  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
      - 'bug'
      - 'patch'
  - title: '⚡ Performance'
    labels:
      - 'perf'
      - 'performance'
  - title: '📖 Documentation'
    labels:
      - 'docs'
      - 'documentation'
  - title: '🧪 Tests'
    labels:
      - 'test'
      - 'testing'
  - title: '📦 Build'
    labels:
      - 'build'
      - 'ci'
  - title: '🧰 Maintenance'
    labels:
      - 'chore'
      - 'refactor'
      - 'style'
# The `!` marker is a Conventional Commits convention for every type, not
# just feat and fix, so `refactor!:`, `build!:` and `chore!:` resolve to a
# major too.  The three patterns stay disjoint: only the `major` one admits a
# `!` before the colon, so a plain `feat(x):` is never labeled breaking.
autolabeler:
  - label: 'major'
    title:
      - '/^\w+(\(.+\))?!:/'
  - label: 'minor'
    title:
      - '/^feat(\(.+\))?:/'
  - label: 'patch'
    title:
      - '/^fix(\(.+\))?:/'
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
template: |
  ## Changes

  $CHANGES
