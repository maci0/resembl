# Update monitoring.
#
# Nothing else in the tree watches the dependency graph: the SBOM workflow
# records what shipped, dependency-review blocks a vulnerable version on a
# pull request, and uv.lock pins exact versions with hashes, but none of them
# opens the update.  Without this file a security fix in a runtime dependency
# sits unnoticed until a scanner happens to flag it at release time.
#
# The `uv` ecosystem edits pyproject.toml and regenerates uv.lock in the same
# pull request, so every bump runs the normal gate (`uv sync --locked`) with a
# lock that matches, which is where it should be reviewed.  Dependabot brings
# its own uv release, which is why `[tool.uv] required-version` is a floor
# rather than an exact pin; CI still installs exactly UV_VERSION.
version: 2

updates:
  # Runtime and development dependencies, plus the build backend pin.  They
  # share one lockfile, so they are grouped: separate pull requests would
  # re-resolve against each other and conflict on every file.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      dependencies:
        patterns:
          - "*"
    ignore:
      # sqlmodel requires sqlalchemy<2.1.0 (every release through 0.0.47), so
      # a 2.1 bump cannot resolve and fails the whole group at `uv sync
      # --locked`.  Drop this once a sqlmodel release allows 2.1, and bump
      # both in the same change.
      - dependency-name: sqlalchemy
        versions: [">=2.1.0"]

  # The workflows pin actions by tag, so an upstream release never reaches a
  # run until it is reviewed here.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
    groups:
      actions:
        patterns:
          - "*"
