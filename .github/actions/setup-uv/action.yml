# Installs the pinned uv release and caches what it downloads, so every
# workflow shares one definition instead of repeating the installer script.
#
# UV_VERSION is pinned twice over, because the installer is fetched over the
# network: it is part of the URL, because the unversioned /uv/install.sh always
# serves the newest uv and a run months from now would drive a different tool
# against the same uv.lock, and it is exported for the script itself. The
# pipeline runs under `pipefail`, so a curl that dies mid-download fails the
# step instead of piping a truncated script into sh.
#
# The cache key is keyed on uv.lock and the interpreter, because uv keys its
# wheel cache by Python version, so the 3.14 pylint leg never serves 3.13
# wheels. A non-empty python-version is also exported as UV_PYTHON, so the
# interpreter a workflow asks for is the one uv builds the environment from and
# not only the one the cache is keyed on.
name: Set up uv
description: Install the pinned uv release and cache its download and wheel caches.

inputs:
  python-version:
    description: Interpreter uv should build the environment from, e.g. "3.14". Empty leaves uv to read .python-version.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # uv's cache root is platform-specific: the XDG roots on Linux and macOS,
    # %LOCALAPPDATA%\uv on Windows.  One step per platform, because
    # actions/cache validates that every listed path exists and fails the
    # step on a missing one, so a combined list would break the runners that
    # do not have the other's directory.
    - name: Restore the uv cache (posix)
      if: runner.os != 'Windows'
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/uv
          ~/.local/share/uv
        key: uv-${{ runner.os }}-${{ inputs.python-version || 'default' }}-${{ hashFiles('uv.lock') }}
        restore-keys: |
          uv-${{ runner.os }}-${{ inputs.python-version || 'default' }}-

    - name: Restore the uv cache (windows)
      if: runner.os == 'Windows'
      uses: actions/cache@v4
      with:
        path: ~\AppData\Local\uv
        key: uv-${{ runner.os }}-${{ inputs.python-version || 'default' }}-${{ hashFiles('uv.lock') }}
        restore-keys: |
          uv-${{ runner.os }}-${{ inputs.python-version || 'default' }}-

    - name: Install uv
      shell: bash
      # The input reaches the script through the environment, never spliced
      # into it, so a caller cannot turn a version string into shell code.
      env:
        UV_VERSION: "0.12.13"
        UV_PYTHON_REQUESTED: ${{ inputs.python-version }}
      run: |
        set -euo pipefail
        curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
        # The installer prints where it put the binary and leaves PATH alone.
        # The Linux and macOS runner images already carry a uv, so only the
        # Windows leg noticed; there the next step failed with "The term 'uv'
        # is not recognized". $GITHUB_PATH takes the platform's own path
        # spelling, which is why the Git Bash view of ~/.local/bin is converted
        # when cygpath is there.
        installed="$HOME/.local/bin"
        if command -v cygpath >/dev/null 2>&1; then
          installed="$(cygpath -w "$installed")"
        fi
        printf '%s\n' "$installed" >> "$GITHUB_PATH"
        if [ -n "$UV_PYTHON_REQUESTED" ]; then
          echo "UV_PYTHON=$UV_PYTHON_REQUESTED" >> "$GITHUB_ENV"
        fi
