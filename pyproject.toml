[project]
name = "resembl"
version = "2.0.0"
description = "Assembly Code Similarity Search (resembl)"
authors = [{ name = "N/A" }]
# SPDX expression, not free text: "GPLv3" is not an SPDX id, so indexers and
# scanners could not match it.  The tree ships the plain GPLv3 text with no
# "or later" grant, so the accurate expression is GPL-3.0-only.
license = "GPL-3.0-only"
# NOTICE ships too: resembl.minhash / resembl.lsh derive from MIT-licensed
# datasketch, and those terms require the grant to travel with every copy.
license-files = ["LICENSE", "NOTICE"]
# The operating systems named here are the three the docs tell a user how to
# install on (README.md, CONTRIBUTING.md, docs/tutorial.md) and the three the
# `portability` job in .github/workflows/tests.yml runs the suite on, so an
# indexer reading this metadata reports what is actually tested.  3.14 is
# listed for the same reason: the pylint matrix runs it.  Nothing claims
# OS Independent: the package writes into a cache directory, locks a config
# file and spawns a process pool, all of which are platform behavior.
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy>=2.0.24",
    "sqlmodel>=0.0.24",
    # Floor at 2.20.0: earlier releases are flagged by CVE-2026-4539
    # (ReDoS in an unused lexer); keep the floor above it so scanners pass.
    "pygments>=2.20.0",
    "rapidfuzz>=3.13.0",
    "rich>=13.0.0",
    "tomli_w>=1.2.0",
    "typer>=0.9.0",
    "numpy>=1.24.0",
    # DBAPI drivers for the non-SQLite backends the CLI advertises in its
    # DATABASE_URL help text and docs (postgresql+pg8000://, mysql+pymysql://).
    # Both are pure Python and small, so a plain install can use them; only
    # the compiled DuckDB driver needs the opt-in extra below.
    "pg8000>=1.31.0",
    "pymysql>=1.1.0",
]

[project.urls]
homepage = "https://github.com/maci0/resembl"
repository = "https://github.com/maci0/resembl"

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1",
    "mypy>=1.16.1",
    "ruff>=0.12.2",
    "black>=25.1.0",
    "pre-commit>=4.2.0",
    # Floor at 4: the tree is adapted to pylint 4's checks (its invalid-name
    # rule flags the two mutable module-level singletons, scoped-disabled
    # inline in resembl.database / resembl.scoring).  Do not lower.
    "pylint>=4",
    "hypothesis>=6.0.0",
    # The DuckDB driver (compiled, tens of MB) is opt-in for users via the
    # `duckdb` extra; the test suite needs it, so dev pulls the same extra.
    "resembl[duckdb]",
    "pytest-benchmark>=4.0.0",
    "pytest-cov>=5.0.0",
    # Test oracle only: resembl.minhash vendors a bit-compatible MinHash, and
    # these tests cross-check fingerprints and banding against the real
    # library.  Never import it from package code.  Floor at 2: the oracle
    # tests pin datasketch's `scheme="legacy"` family explicitly, a 2.0-only
    # keyword, so resolving 1.x fails the suite at collection.
    "datasketch>=2",
]
duckdb = [
    # Compiled DuckDB driver plus its SQLAlchemy dialect.  Needed only for a
    # `duckdb:///file.db` DATABASE_URL, so it is not a runtime dependency.
    "duckdb>=1.0.0",
    "duckdb-engine>=0.13.0",
]
fuzz = [
    "atheris>=2.3.0",
]

[project.scripts]
resembl = "resembl.cli:main"
resembl-find = "resembl.find_client:main"

[tool.uv]
# uv is the build tool: it reads uv.lock, resolves the environment and drives
# the sdist and wheel build.  Every workflow installs this exact release
# (UV_VERSION), so it is declared here too, which makes a mismatch fail at the
# first uv command instead of after a lockfile was regenerated by a version CI
# never runs.
required-version = "==0.12.13"

[build-system]
# Pinned exactly, not floored: the sdist and the wheel are the release
# artifacts, and an open range lets the backend drift between two builds of
# the same source.  80.9.0 is well above the setuptools 77 floor for PEP 639
# metadata (the SPDX `license` string and `license-files` above), which older
# setuptools rejects.
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
# Ship the application package only: without this, find_packages also picks
# up the `tests` package (it has __init__.py) and every install puts a
# top-level `tests` module into site-packages.
include = ["resembl*"]

[tool.black]
line-length = 100
# Pinned rather than inferred: black otherwise derives the target set from
# `requires-python = ">=3.13"`, which is open ended, so the formatting a
# given black version produces depends on how new the running interpreter is.
target-version = ["py313"]

[tool.ruff]
line-length = 100

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
# Pylint is the defect gate (error-level checks stay on). The messages below
# are disabled with cause: they conflict with deliberate project conventions
# or duplicate checks owned by ruff/mypy. Revisit when the underlying cause
# changes; do not extend this list to silence a one-off (use an inline,
# scoped `# pylint: disable=<msg>` instead).
disable = [
    # Lazy imports are architecture, not accidents: the package is
    # import-light by design and CLI commands import heavy modules on use.
    "import-outside-toplevel",
    "wrong-import-position",
    "consider-using-from-import",
    # core/models re-export blocks keep `from resembl.core import X` working;
    # unused-import/reimported hygiene is ruff's F401/F811 territory.
    "reimported",
    "unused-import",
    # Typer command/callback signatures rebind parameter names by convention.
    "redefined-outer-name",
    # Boundary handlers (CLI, server) catch Exception deliberately.
    "broad-exception-caught",
    # Module-level engine/config singletons need module globals.
    "global-statement",
    # R0801 fires on parallel test/fuzzer fixture boilerplate (temp-file
    # databases, `import resembl.models` for table registration) spread over
    # several test modules. Interface-conformance signatures (SQLAlchemy
    # listeners, hypothesis @given, http.server overrides) keep their named
    # parameters instead: they scope their message inline, and the two stubs
    # that need it live in tests/test_server.py.
    "duplicate-code",
    # astroid cannot see through SQLModel's dynamic field proxies or the
    # package's lazy __getattr__ exports; these fire only on false positives.
    "not-callable",
    "no-member",
    "undefined-all-variable",
    "no-name-in-module",
    # Complexity refactoring (god-files, long functions) is tracked as its
    # own work; blocking every push on it keeps the gate permanently red.
    "too-few-public-methods",
    "too-many-public-methods",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-branches",
    "too-many-locals",
    "too-many-return-statements",
    "too-many-statements",
    "too-many-lines",
    # Docstring coverage is not enforced anywhere in this project.
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    # Tests hold temp files/dirs across the whole test body on purpose.
    "consider-using-with",
]

[tool.ruff.lint]
# pycodestyle errors/subgroups (E4/E7/E9), pyflakes, isort, warnings,
# flake8-builtins, bugprone-adjacent correctness groups that the tree
# currently passes, plus autofixable modernization (pyupgrade).
# RUF100 keeps `# noqa` directives honest: stale suppressions fail lint.
select = [
    "E4",
    "E7",
    "E9",
    "W",
    "F",
    "I",
    "A",
    "DTZ",
    "ISC",
    "ICN",
    "PIE",
    "RSE",
    "EXE",
    "YTT",
    "FLY",
    "ASYNC",
    "FURB",
    "UP",
    "C4",
    "RET",
    "PERF",
    "N",
    "T10",
    # Bug-prone correctness group: raises inside except without explicit
    # chaining (B904), zip() without strict= (B905), mutable/loop hazards.
    "B",
    # Commented-out code left behind after a refactor.
    "ERA",
    # Logging misuse: f-strings and eager %-formatting in logger calls, which
    # cost formatting work even when the record is filtered out, plus the
    # logging-format (G) rules that reject an f-string or an interpolation
    # the call does not actually perform.
    "LOG",
    "G",
    # pygrep-hooks: bad type: ignore / noqa spellings, exec/eval warnings.
    "PGH",
    # Full ruff group (includes RUF100, which keeps `# noqa` honest):
    # ambiguous-unicode docstring/comment checks are enabled and the tree
    # is kept free of confusable characters.
    "RUF",
]

[tool.ruff.lint.flake8-bugbear]
# Typer builds its parameter metadata by calling typer.Option/typer.Argument in
# the signature default; that is the framework's documented idiom, not a mutable
# default argument.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.isort]
known-first-party = ["resembl"]

[tool.mypy]
python_version = "3.13"
files = ["resembl", "tests", "fuzzers"]
ignore_missing_imports = true
# Strict flags the whole tree (package + tests) already passes.
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
strict_equality = true
warn_unreachable = true
# A function whose declared return type is not `None` that can still fall off
# its end returns None at runtime; the whole tree already passes this.
warn_no_return = true
disallow_subclassing_any = true
# bytes stays bytes: passing a bytearray/memoryview where bytes is declared is
# a type error, not a silent copy.
strict_bytes = true
extra_checks = true
# Extra error codes the whole tree passes; each catches a defect class:
# unscoped (bare) suppressions, tautological expressions, always-truthy
# assertions on bool-typed objects.
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# Ratchet: the library package must stay fully annotated; tests remain gradual.
[[tool.mypy.overrides]]
module = "resembl.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_globals = true
disallow_untyped_decorators = true

# numpy is type-checked through its shipped stubs.  An earlier
# `follow_imports = "skip"` override for `numpy.*` was needed while the check
# target was Python 3.11, which could not parse the PEP 695 syntax those stubs
# use; the target is 3.13 and the stubs parse, so the override is gone and
# resembl.minhash is checked against real numpy types instead of `Any`.

[tool.pytest.ini_options]
addopts = "--benchmark-disable"
