[project]
name = "resembl"
version = "0.1.0"
description = "Assembly Code Similarity Search (resembl)"
authors = [{ name = "N/A" }]
license = { text = "GPLv3" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.24",
    "sqlmodel>=0.0.24",
    "pygments>=2.19.2",
    "rapidfuzz>=3.13.0",
    "rich>=13.0.0",
    "tomli_w>=1.2.0",
    "typer>=0.9.0",
    "numpy>=1.24.0",
]

[project.urls]
homepage = "https://github.com/maci0/resembl"
repository = "https://github.com/maci0/resembl"

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1",
    "mypy>=1.16.1",
    "ruff>=0.12.2",
    "black>=25.1.0",
    "pre-commit>=4.2.0",
    # Cap at <4: pylint 4.x adds checks the tree has not been adapted to,
    # which would turn the Pylint CI gate red for everyone on next resolve.
    # Lift the cap in a pass that fixes the new findings, not before.
    "pylint>=3.3.7,<4",
    "hypothesis>=6.0.0",
    "pg8000>=1.31.0",
    "duckdb>=1.0.0",
    "duckdb-engine>=0.13.0",
    "pymysql>=1.1.0",
    "pytest-benchmark>=4.0.0",
    "pytest-cov>=5.0.0",
    # Test oracle only: resembl.minhash vendors a bit-compatible MinHash, and
    # these tests cross-check fingerprints and banding against the real
    # library.  Never import it from package code.
    "datasketch>=1.6.5",
]
# atheris publishes wheels only for Python >= 3.12 (no sdist since 2.x);
# gate the extra so `.[dev,fuzz]` stays installable on every supported Python.
fuzz = [
    "atheris>=2.3.0; python_version >= '3.12'",
]

[project.scripts]
resembl = "resembl.cli:main"
resembl-find = "resembl.find_client:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
# Ship the application package only: without this, find_packages also picks
# up the `tests` package (it has __init__.py) and every install puts a
# top-level `tests` module into site-packages.
include = ["resembl*"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
# Pylint is the defect gate (error-level checks stay on). The messages below
# are disabled with cause: they conflict with deliberate project conventions
# or duplicate checks owned by ruff/mypy. Revisit when the underlying cause
# changes; do not extend this list to silence a one-off (use an inline,
# scoped `# pylint: disable=<msg>` instead).
disable = [
    # Lazy imports are architecture, not accidents: the package is
    # import-light by design and CLI commands import heavy modules on use.
    "import-outside-toplevel",
    "wrong-import-position",
    "consider-using-from-import",
    # core/models re-export blocks keep `from resembl.core import X` working;
    # unused-import/reimported hygiene is ruff's F401/F811 territory.
    "reimported",
    "unused-import",
    # Typer command/callback signatures rebind parameter names by convention.
    "redefined-outer-name",
    # Boundary handlers (CLI, server) catch Exception deliberately.
    "broad-exception-caught",
    # Module-level engine/config singletons need module globals.
    "global-statement",
    # Interface-conformance signatures (SQLAlchemy listeners, hypothesis
    # @given, http.server overrides) must keep their named parameters. Only
    # two such stubs exist in the tree; both scope the message inline in
    # tests/test_server.py instead of disabling it here.
    # Parallel test/fuzzer boilerplate is intentional.
    "duplicate-code",
    # astroid cannot see through SQLModel's dynamic field proxies or the
    # package's lazy __getattr__ exports; these fire only on false positives.
    "not-callable",
    "no-member",
    "undefined-all-variable",
    "no-name-in-module",
    # Complexity refactoring (god-files, long functions) is tracked as its
    # own work; blocking every push on it keeps the gate permanently red.
    "too-few-public-methods",
    "too-many-public-methods",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-branches",
    "too-many-locals",
    "too-many-return-statements",
    "too-many-statements",
    "too-many-lines",
    # Docstring coverage is not enforced anywhere in this project.
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    # Tests hold temp files/dirs across the whole test body on purpose.
    "consider-using-with",
]

[tool.ruff.lint]
# pycodestyle errors/subgroups (E4/E7/E9), pyflakes, isort, warnings,
# flake8-builtins, bugprone-adjacent correctness groups that the tree
# currently passes, plus autofixable modernization (pyupgrade).
# RUF100 keeps `# noqa` directives honest: stale suppressions fail lint.
select = [
    "E4",
    "E7",
    "E9",
    "W",
    "F",
    "I",
    "A",
    "DTZ",
    "ISC",
    "ICN",
    "PIE",
    "RSE",
    "EXE",
    "YTT",
    "FLY",
    "ASYNC",
    "FURB",
    "UP",
    "C4",
    "RET",
    "PERF",
    "N",
    "T10",
    # Full ruff group (includes RUF100, which keeps `# noqa` honest):
    # ambiguous-unicode docstring/comment checks are enabled and the tree
    # is kept free of confusable characters.
    "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["resembl"]

[tool.mypy]
python_version = "3.11"
files = ["resembl", "tests", "fuzzers"]
ignore_missing_imports = true
# Strict flags the whole tree (package + tests) already passes.
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
strict_equality = true
warn_unreachable = true
disallow_subclassing_any = true
extra_checks = true
# Extra error codes the whole tree passes; each catches a defect class:
# unscoped (bare) suppressions, tautological expressions, always-truthy
# assertions on bool-typed objects.
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# Ratchet: the library package must stay fully annotated; tests remain gradual.
[[tool.mypy.overrides]]
module = "resembl.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_globals = true
disallow_untyped_decorators = true

[tool.pytest.ini_options]
addopts = "--benchmark-disable"
