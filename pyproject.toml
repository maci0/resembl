[project]
name = "resembl"
version = "2.0.0"
description = "Assembly Code Similarity Search (resembl)"
authors = [{ name = "N/A" }]
license = { text = "GPLv3" }
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy>=2.0.24",
    "sqlmodel>=0.0.24",
    # Floor at 2.20.0: earlier releases are flagged by CVE-2026-4539
    # (ReDoS in an unused lexer); keep the floor above it so scanners pass.
    "pygments>=2.20.0",
    "rapidfuzz>=3.13.0",
    "rich>=13.0.0",
    "tomli_w>=1.2.0",
    "typer>=0.9.0",
    "numpy>=1.24.0",
]

[project.urls]
homepage = "https://github.com/maci0/resembl"
repository = "https://github.com/maci0/resembl"

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1",
    "mypy>=1.16.1",
    "ruff>=0.12.2",
    "black>=25.1.0",
    "pre-commit>=4.2.0",
    # Floor at 4: the tree is adapted to pylint 4's checks (its invalid-name
    # rule flags the two mutable module-level singletons, scoped-disabled
    # inline in resembl.database / resembl.scoring).  Do not lower.
    "pylint>=4",
    "hypothesis>=6.0.0",
    "pg8000>=1.31.0",
    "duckdb>=1.0.0",
    "duckdb-engine>=0.13.0",
    "pymysql>=1.1.0",
    "pytest-benchmark>=4.0.0",
    "pytest-cov>=5.0.0",
    # Test oracle only: resembl.minhash vendors a bit-compatible MinHash, and
    # these tests cross-check fingerprints and banding against the real
    # library.  Never import it from package code.  Floor at 2: the oracle
    # tests pin datasketch's `scheme="legacy"` family explicitly, a 2.0-only
    # keyword, so resolving 1.x fails the suite at collection.
    "datasketch>=2",
]
fuzz = [
    "atheris>=2.3.0",
]

[project.scripts]
resembl = "resembl.cli:main"
resembl-find = "resembl.find_client:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
# Ship the application package only: without this, find_packages also picks
# up the `tests` package (it has __init__.py) and every install puts a
# top-level `tests` module into site-packages.
include = ["resembl*"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
# Pylint is the defect gate (error-level checks stay on). The messages below
# are disabled with cause: they conflict with deliberate project conventions
# or duplicate checks owned by ruff/mypy. Revisit when the underlying cause
# changes; do not extend this list to silence a one-off (use an inline,
# scoped `# pylint: disable=<msg>` instead).
disable = [
    # Lazy imports are architecture, not accidents: the package is
    # import-light by design and CLI commands import heavy modules on use.
    "import-outside-toplevel",
    "wrong-import-position",
    "consider-using-from-import",
    # core/models re-export blocks keep `from resembl.core import X` working;
    # unused-import/reimported hygiene is ruff's F401/F811 territory.
    "reimported",
    "unused-import",
    # Typer command/callback signatures rebind parameter names by convention.
    "redefined-outer-name",
    # Boundary handlers (CLI, server) catch Exception deliberately.
    "broad-exception-caught",
    # Module-level engine/config singletons need module globals.
    "global-statement",
    # Interface-conformance signatures (SQLAlchemy listeners, hypothesis
    # @given, http.server overrides) must keep their named parameters. Only
    # two such stubs exist in the tree; both scope the message inline in
    # tests/test_server.py instead of disabling it here.
    # Parallel test/fuzzer boilerplate is intentional.
    "duplicate-code",
    # astroid cannot see through SQLModel's dynamic field proxies or the
    # package's lazy __getattr__ exports; these fire only on false positives.
    "not-callable",
    "no-member",
    "undefined-all-variable",
    "no-name-in-module",
    # Complexity refactoring (god-files, long functions) is tracked as its
    # own work; blocking every push on it keeps the gate permanently red.
    "too-few-public-methods",
    "too-many-public-methods",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-branches",
    "too-many-locals",
    "too-many-return-statements",
    "too-many-statements",
    "too-many-lines",
    # Docstring coverage is not enforced anywhere in this project.
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    # Tests hold temp files/dirs across the whole test body on purpose.
    "consider-using-with",
]

[tool.ruff.lint]
# pycodestyle errors/subgroups (E4/E7/E9), pyflakes, isort, warnings,
# flake8-builtins, bugprone-adjacent correctness groups that the tree
# currently passes, plus autofixable modernization (pyupgrade).
# RUF100 keeps `# noqa` directives honest: stale suppressions fail lint.
select = [
    "E4",
    "E7",
    "E9",
    "W",
    "F",
    "I",
    "A",
    "DTZ",
    "ISC",
    "ICN",
    "PIE",
    "RSE",
    "EXE",
    "YTT",
    "FLY",
    "ASYNC",
    "FURB",
    "UP",
    "C4",
    "RET",
    "PERF",
    "N",
    "T10",
    # Full ruff group (includes RUF100, which keeps `# noqa` honest):
    # ambiguous-unicode docstring/comment checks are enabled and the tree
    # is kept free of confusable characters.
    "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["resembl"]

[tool.mypy]
python_version = "3.13"
files = ["resembl", "tests", "fuzzers"]
ignore_missing_imports = true
# Strict flags the whole tree (package + tests) already passes.
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
strict_equality = true
warn_unreachable = true
disallow_subclassing_any = true
extra_checks = true
# Extra error codes the whole tree passes; each catches a defect class:
# unscoped (bare) suppressions, tautological expressions, always-truthy
# assertions on bool-typed objects.
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# Ratchet: the library package must stay fully annotated; tests remain gradual.
[[tool.mypy.overrides]]
module = "resembl.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_globals = true
disallow_untyped_decorators = true

# numpy >= 2.5 ships stubs written in 3.12+ syntax (PEP 695 `type` aliases),
# which this project's 3.11 target cannot parse — yet the package itself
# runs fine against numpy 2.5 on every supported runtime, which is also what
# the test suite validates.  `follow_imports = "skip"` alone does not help:
# mypy's resolver forces stubs back to `"normal"` regardless
# (`"Stubs are always normal"`, `mypy/build.py`), so the files are still
# parsed.  The working combination is skip *plus* `follow_imports_for_stubs`
# (its documented pair — "except when they aren't"), which skips even stub
# modules; `resembl.minhash` then sees `np` names as `Any`.  Options were:
# pin users to numpy < 2.5 (wrong — 2.5 is what ships and what the suite
# validates), or raise the check target to 3.12 (that would weaken the 3.11
# compatibility the tree promises).  The tree's *own* annotations stay
# fully checked.  Revisit if mypy ever gains version-gated parsing.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
addopts = "--benchmark-disable"
