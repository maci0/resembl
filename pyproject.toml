[project]
name = "resembl"
version = "0.1.0"
description = "Assembly Code Similarity Search (resembl)"
authors = [{ name = "N/A" }]
license = { text = "GPLv3" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.24",
    "sqlmodel>=0.0.24",
    "pygments>=2.19.2",
    "datasketch>=1.6.5",
    "rapidfuzz>=3.13.0",
    "rich>=13.0.0",
    "tomli_w>=1.2.0",
    "typer>=0.9.0",
    "numpy>=1.24.0",
]

[project.urls]
homepage = "https://github.com/maci0/resembl"
repository = "https://github.com/maci0/resembl"

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1",
    "mypy>=1.16.1",
    "ruff>=0.12.2",
    "black>=25.1.0",
    "pre-commit>=4.2.0",
    "pylint>=3.3.7",
    "slipcover>=1.0.17",
    "hypothesis>=6.0.0",
    "pg8000>=1.31.0",
    "duckdb>=1.0.0",
    "duckdb-engine>=0.13.0",
    "pymysql>=1.1.0",
    "pytest-benchmark>=4.0.0",
    "pytest-cov>=5.0.0",
]
# atheris publishes wheels only for Python >= 3.12 (no sdist since 2.x);
# gate the extra so `.[dev,fuzz]` stays installable on every supported Python.
fuzz = [
    "atheris>=2.3.0; python_version >= '3.12'",
]

[project.scripts]
resembl = "resembl.cli:main"
resembl-find = "resembl.find_client:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.pylint.format]
max-line-length = 100

[tool.ruff.lint]
# pycodestyle errors/subgroups (E4/E7/E9), pyflakes, isort, warnings,
# flake8-builtins, bugprone-adjacent correctness groups that the tree
# currently passes, plus autofixable modernization (pyupgrade).
select = [
    "E4",
    "E7",
    "E9",
    "W",
    "F",
    "I",
    "A",
    "DTZ",
    "ISC",
    "ICN",
    "PIE",
    "RSE",
    "EXE",
    "YTT",
    "FLY",
    "ASYNC",
    "FURB",
    "UP",
    "C4",
    "RET",
    "PERF",
    "N",
]

[tool.ruff.lint.isort]
known-first-party = ["resembl"]

[tool.pyright]
include = ["resembl", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"

[tool.mypy]
python_version = "3.11"
files = ["resembl", "tests"]
ignore_missing_imports = true
# Strict flags the tree already passes; tighten further in later passes.
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
warn_unreachable = true
disallow_subclassing_any = true
extra_checks = true

[tool.pytest.ini_options]
addopts = "--benchmark-disable"
